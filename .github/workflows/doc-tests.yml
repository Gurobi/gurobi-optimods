# Run the doctests against the pre-built wheel artifact (with the 'examples'
# extra). Only the docs are checked out. Callers must run after build-wheel.

name: Doc tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  doc-tests:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
        gurobipy: ["~=13.0", "~=14.0"]

    steps:
      - name: Checkout docs
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            docs
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch built wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-artifact
          path: dist
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          python -m pip install gurobipy${{ matrix.gurobipy }}
          python -m pip install "$(ls dist/*.whl)[examples]"
          python -m pip install -r docs/requirements.txt
      - name: Run doctests
        run: |
          cd docs
          make doctest
