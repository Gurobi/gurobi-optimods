# The docs should build without warnings from sphinx. Uses the pre-built wheel
# artifact; only the docs are checked out. Callers must run after build-wheel.

name: Docs build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  doc-build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11"]

    steps:
      - name: Checkout docs
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            docs
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch built wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-artifact
          path: dist
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
      - name: Install docs build dependencies
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install dist/*.whl
      - name: Build docs (fail on warnings)
        run: |
          cd docs
          make clean html SPHINXOPTS="-W --keep-going -n"
